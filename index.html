<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinematic GSAP Card Stack - Blood & Steel</title>
  <style>
    /* Premium Cinematic Katana Pairing: Marcellus for sharp, blade-like titles, Shippori Mincho for elegant body text */
    @import url('https://fonts.googleapis.com/css2?family=Marcellus&family=Shippori+Mincho:wght@400;500&display=swap');

    :root {
      --bg-color: #010204;
      --card-bg: #0a0d14;
      --text-main: #fcfaf2;
      --text-muted: #8a94a6;
      --accent-warm: #e63946; 
      --accent-glow: #ff7b00;
      --accent-cool: #00b4d8;
      --dot-active: var(--accent-glow);
      --dot-inactive: rgba(255, 255, 255, 0.08);
      --card-width: 520px;
      --card-height: 340px;
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at center, transparent 30%, #000000 100%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
      font-family: 'Shippori Mincho', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .card-stack-container {
      width: 100%;
      max-width: 1000px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .spotlight-1 {
      position: absolute;
      top: -10%; left: 0%; right: 40%;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 180, 216, 0.1) 0%, transparent 60%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 1;
    }
    
    .spotlight-2 {
      position: absolute;
      bottom: -20%; left: 10%; right: 10%;
      height: 350px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(230, 57, 70, 0.2) 0%, rgba(255, 123, 0, 0.08) 40%, transparent 70%);
      filter: blur(70px);
      pointer-events: none;
      z-index: 1;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 480px; 
      perspective: 1200px;
      outline: none;
      touch-action: pan-y;
      z-index: 2;
    }

    .card {
      position: absolute;
      bottom: 20px;
      left: 50%;
      margin-left: calc(var(--card-width) / -2);
      width: var(--card-width);
      height: var(--card-height);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      background-color: var(--card-bg);
      box-shadow: 
        inset 0 1px 1px rgba(255, 255, 255, 0.05),
        0 40px 80px -12px rgba(0, 0, 0, 0.95), 
        0 20px 40px -15px rgba(0, 0, 0, 1);
      overflow: hidden;
      cursor: grab;
      user-select: none;
      transform-style: preserve-3d;
      will-change: transform;
      opacity: 0;
    }

    .card.is-active {
      cursor: grab;
      border: 1px solid rgba(255, 123, 0, 0.3);
      box-shadow: 
        inset 0 1px 1px rgba(255, 255, 255, 0.1),
        0 0 30px rgba(230, 57, 70, 0.15),
        0 50px 100px -15px rgba(0, 0, 0, 0.98), 
        0 25px 50px -20px rgba(0, 0, 0, 1);
    }
    
    .card.is-active:active {
      cursor: grabbing;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      transform: scale(1.02);
      transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
      filter: contrast(1.15) saturate(0.85) brightness(0.9);
    }

    .card.is-active:hover img {
      transform: scale(1.06);
    }

    .card-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10, 13, 20, 0.98) 0%, rgba(10, 13, 20, 0.7) 35%, transparent 100%);
      pointer-events: none;
    }

    .card-content {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 36px;
      pointer-events: none;
    }

    .card-title {
      font-family: 'Marcellus', serif;
      font-size: 2rem; 
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(252, 250, 242, 0.15), 0 2px 4px rgba(0,0,0,0.9);
    }

    .card-desc {
      font-family: 'Shippori Mincho', serif;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.6;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
    }

    .dots-nav {
      margin-top: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 2;
    }

    .dot {
      width: 24px;
      height: 3px;
      border-radius: 2px;
      background-color: var(--dot-inactive);
      border: none;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      padding: 0;
    }

    .dot:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .dot.active {
      width: 40px;
      background-color: var(--dot-active);
      box-shadow: 0 0 15px rgba(255, 123, 0, 0.6);
    }
  </style>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div class="card-stack-container">
    <div class="stage" id="stage" tabindex="0">
      <div class="spotlight-1"></div>
      <div class="spotlight-2"></div>
      <div id="cards-container"></div>
    </div>
    
    <div class="dots-nav" id="dots-container"></div>
  </div>

  <script>
    const items = [
      { id: 1, title: "Honjo Masamune", description: "The legendary symbol of the Tokugawa Shogunate.", imageSrc: "katana-1.png" },
      { id: 2, title: "Muramasa's Edge", description: "A blade said to hunger for battle.", imageSrc: "katana-2.png" },
      { id: 3, title: "Doji-giri Yasutsuna", description: "One of the Five Swords Under Heaven.", imageSrc: "katana-3.png" },
      { id: 4, title: "Mikazuki Munechika", description: "Named for the crescent moon.", imageSrc: "katana-4.png" },
      { id: 5, title: "Kiku-ichimonji", description: "Engraved with the imperial chrysanthemum.", imageSrc: "katana-5.png" }
    ];

    const len = items.length;
    const maxVisible = 7;
    const cardWidth = 520;
    const overlap = 0.48;
    const spreadDeg = 48;
    const depthPx = 140;
    const tiltXDeg = 12;
    const activeLiftPx = 22;
    const activeScale = 1.03;
    const inactiveScale = 0.94;
    const loop = true;

    const maxOffset = Math.max(0, Math.floor(maxVisible / 2));
    const cardSpacing = Math.max(10, Math.round(cardWidth * (1 - overlap)));
    const stepDeg = maxOffset > 0 ? spreadDeg / maxOffset : 0;

    let activeIndex = 0;
    const cardsContainer = document.getElementById("cards-container");
    const dotsContainer = document.getElementById("dots-container");
    const stage = document.getElementById("stage");
    let cardElements = [];
    let dotElements = [];

    function wrapIndex(n, length) {
      if (length <= 0) return 0;
      return ((n % length) + length) % length;
    }

    function signedOffset(i, active, length, isLooping) {
      const raw = i - active;
      if (!isLooping || length <= 1) return raw;
      const alt = raw > 0 ? raw - length : raw + length;
      return Math.abs(alt) < Math.abs(raw) ? alt : raw;
    }

    function init() {
      items.forEach((item, i) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${item.imageSrc}" alt="${item.title}" draggable="false" onerror="this.onerror=null;this.src='https://placehold.co/520x340/1a1f2e/FFF?text=${item.title.split(' ')[0]}';" />
          <div class="card-gradient"></div>
          <div class="card-content">
            <div class="card-title">${item.title}</div>
            <div class="card-desc">${item.description}</div>
          </div>
        `;
        
        card.addEventListener("click", () => {
          activeIndex = i;
          renderLayout();
        });
        
        cardsContainer.appendChild(card);
        cardElements.push(card);

        const dot = document.createElement("button");
        dot.className = "dot";
        dot.addEventListener("click", () => {
          activeIndex = i;
          renderLayout();
        });
        dotsContainer.appendChild(dot);
        dotElements.push(dot);
      });

      renderLayout();
      initSmoothDragAndKeyboard();
    }

    function renderLayout() {
      cardElements.forEach((card, i) => {
        const off = signedOffset(i, activeIndex, len, loop);
        const abs = Math.abs(off);
        const visible = abs <= maxOffset;

        if (!visible) {
          gsap.to(card, { autoAlpha: 0, scale: 0, duration: 0.4 });
          return;
        }

        const rotateZ = off * stepDeg;
        const x = off * cardSpacing;
        const y = abs * 10;
        const z = -abs * depthPx;

        const isActive = off === 0;
        const scale = isActive ? activeScale : inactiveScale;
        const lift = isActive ? -activeLiftPx : 0;
        const rotateX = isActive ? 0 : tiltXDeg;
        const zIndex = 100 - abs;

        if (isActive) card.classList.add("is-active");
        else card.classList.remove("is-active");

        gsap.to(card, {
          autoAlpha: 1,
          x: x,
          y: y + lift,
          z: z,
          rotationZ: rotateZ,
          rotationX: rotateX,
          scale: scale,
          zIndex: zIndex,
          duration: 0.6,
          ease: "back.out(1.1)",
          overwrite: "auto"
        });
      });

      dotElements.forEach((dot, i) => {
        dot.classList.toggle("active", i === activeIndex);
      });
    }

    function initSmoothDragAndKeyboard() {
      let isDragging = false;
      let startX = 0;
      let currentDragX = 0;
      let activeCard = null;

      stage.addEventListener("pointerdown", (e) => {
        const clickedCard = e.target.closest('.card.is-active');
        if (!clickedCard) return; 
        
        isDragging = true;
        startX = e.clientX;
        activeCard = clickedCard;
        
        gsap.killTweensOf(activeCard);
      });

      window.addEventListener("pointermove", (e) => {
        if (!isDragging || !activeCard) return;
        
        currentDragX = e.clientX - startX;
        gsap.set(activeCard, { x: currentDragX });
      });

      window.addEventListener("pointerup", (e) => {
        if (!isDragging) return;
        isDragging = false;
        
        const threshold = Math.min(160, cardWidth * 0.22);

        if (currentDragX > threshold) {
          activeIndex = wrapIndex(activeIndex - 1, len);
        } else if (currentDragX < -threshold) {
          activeIndex = wrapIndex(activeIndex + 1, len);
        }

        renderLayout();
        
        currentDragX = 0;
        activeCard = null;
      });

      stage.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") {
          activeIndex = wrapIndex(activeIndex - 1, len);
          renderLayout();
        } else if (e.key === "ArrowRight") {
          activeIndex = wrapIndex(activeIndex + 1, len);
          renderLayout();
        }
      });
    }

    init();
  </script>
</body>
</html>
