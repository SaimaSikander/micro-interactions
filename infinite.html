<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immersive 3D Tunnel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f2f8fc;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .viewport {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            /* DEEPER PERSPECTIVE: Lower value = more "fisheye" / immersive */
            perspective: 400px; 
            overflow: hidden;
    
        }

        .world {
            position: absolute;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
        }

        .card {
            position: absolute;
            top: 50%;
            left: 50%;
            /* LARGER CARDS */
            width: 700px;
            height: 850px;
            /* Center the card on its coordinates */
            margin-left: -200px;
            margin-top: -275px;
            background: #1a1a1a;
            border-radius: 15px;
            overflow: hidden;
            transform-origin: 50% 50%;
            will-change: transform, opacity;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            opacity: 0;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            /* Subtle darkening of images for depth */
            filter: brightness(0.8);
        }

        .ui {
            position: fixed;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: white;
            letter-spacing: 2px;
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.4;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="viewport">
        <div class="world" id="world"></div>
    </div>
    
    <div class="ui">Scroll or Swipe to Accelerate</div>

    <script>
        const CONFIG = {
            count: 25,              // More cards for a longer tunnel
            spacing: 500,           // More space between them
            radius: 700,            // WIDER RADIUS: Pushes cards to the edges
            baseSpeed: 1.2,         // Slightly faster cruise speed
        };

        const IMAGES = [
            '1 (1).png',
            '1 (2).png',
            '1 (3).png',
            '1 (4).png',
            '1 (5).png',
            '1 (6).png'
        ];

        let scrollPos = 0;
        let targetSpeed = 0;
        const world = document.getElementById('world');
        const cards = [];
        const maxDepth = CONFIG.count * CONFIG.spacing;

        function init() {
            for (let i = 0; i < CONFIG.count; i++) {
                const el = document.createElement('div');
                el.className = 'card';
                
                const img = document.createElement('img');
                img.src = IMAGES[i % IMAGES.length];
                el.appendChild(img);
                world.appendChild(el);

                // Create a circular spiral
                const angle = i * 0.8; 
                
                cards.push({
                    el: el,
                    x: Math.cos(angle) * CONFIG.radius,
                    y: Math.sin(angle) * CONFIG.radius,
                    // Rotate the card to face the center of the tunnel
                    rotZ: (angle * 180 / Math.PI) + 90, 
                    zOffset: i * CONFIG.spacing
                });
            }

            gsap.ticker.add(render);
        }

        function render() {
            scrollPos += CONFIG.baseSpeed + targetSpeed;
            targetSpeed *= 0.95;

            cards.forEach((card) => {
                let z = (card.zOffset + scrollPos) % maxDepth;
                z -= maxDepth;

                let opacity = 1;
                
                // Fade in from the very far distance
                if (z < -maxDepth + 2000) {
                    opacity = mapRange(z, -maxDepth, -maxDepth + 2000, 0, 1);
                } 
                // Fade out as it passes the "camera"
                else if (z > -800) {
                    opacity = mapRange(z, -800, 200, 1, 0);
                }

                // Optimization: Don't update if completely invisible
                if (z > -maxDepth && z < 200) {
                    gsap.set(card.el, {
                        x: card.x,
                        y: card.y,
                        z: z,
                        rotationZ: card.rotZ,
                        opacity: opacity,
                        force3D: true 
                    });
                }
            });
        }

        function mapRange(value, inMin, inMax, outMin, outMax) {
            return ((value - inMin) * (outMax - outMin)) / (inMax - inMin) + outMin;
        }

        window.addEventListener('wheel', (e) => {
            targetSpeed += e.deltaY * 0.1;
        });
        
        // Touch Support
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => touchStartY = e.touches[0].clientY);
        window.addEventListener('touchmove', (e) => {
            const delta = touchStartY - e.touches[0].clientY;
            targetSpeed += delta * 0.05;
        });

        init();
    </script>
</body>
</html>
