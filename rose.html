<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smooth Scroll Video</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>

body{
margin:0;
background:white;
font-family:sans-serif;
overflow-x:hidden;
}

.scroll-wrapper{
position:relative;
height:500vh;
}

.video-sticky{
position:sticky;
top:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:white;
overflow:hidden;
}

#rose-video{
width:100%;
height:100%;
object-fit:contain;
will-change:transform;
transform:translateZ(0);
}

</style>
</head>

<body>

<div class="scroll-wrapper">
<div class="video-sticky">

<video
id="rose-video"
src="Untitled design (11).mp4"
playsinline
webkit-playsinline
muted
preload="auto"
></video>

</div>
</div>

<script>

gsap.registerPlugin(ScrollTrigger)

const video = document.querySelector("#rose-video")

video.pause()
video.currentTime = 0

video.addEventListener("loadedmetadata", () => {

let duration = video.duration

let proxy = {time:0}

gsap.to(proxy,{
time:duration,
ease:"none",

scrollTrigger:{
trigger:".scroll-wrapper",
start:"top top",
end:"bottom bottom",
scrub:0.3,
anticipatePin:1
},

onUpdate:()=>{
video.currentTime = proxy.time
}

})

})

</script>

</body>
</html>
