<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Teddy Day</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff0f5 0%, #ffe6eb 100%);
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.8);
            --bear-fur: #e0ac69;
            --bear-shadow: #c68e52;
            --bear-light: #f4d0a0;
            --heart-color: #ff5c7c;
            --text-color: #5d4037;
            --btn-gradient: linear-gradient(45deg, #ff8fa3, #ff5c7c);
        }

        body {
            margin: 0;
            height: 100vh;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            perspective: 1200px;
        }

        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        /* --- Card --- */
        .card {
            position: relative;
            z-index: 10;
            width: 340px;
            height: 480px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 50px;
            transition: transform 0.2s ease-out;
            transform-style: preserve-3d;
            cursor: pointer; /* Whole card is clickable now */
        }

        /* --- Bear --- */
        .bear-stage {
            position: absolute;
            bottom: 160px;
            width: 200px;
            height: 180px;
            transform: translateZ(40px);
            pointer-events: none; /* Passes clicks to card */
        }

        .part {
            position: absolute;
            background: var(--bear-fur);
            box-shadow: inset 4px 4px 10px var(--bear-light), inset -4px -4px 10px var(--bear-shadow);
        }

        .head {
            width: 110px; height: 100px; border-radius: 45% 45% 40% 40%;
            top: 0; left: 45px; z-index: 2;
        }

        .ear {
            width: 40px; height: 40px; border-radius: 50%; top: 5px; z-index: 1;
        }
        .ear.left { left: 30px; }
        .ear.right { right: 30px; }

        .body {
            width: 120px; height: 100px; border-radius: 45% 45% 45% 45%;
            top: 85px; left: 40px; z-index: 1;
        }

        /* --- Face Features --- */
        .muzzle {
            width: 45px; height: 32px; background: #fff5e6; border-radius: 20px;
            position: absolute; top: 50px; left: 33px;
        }
        .nose {
            width: 16px; height: 12px; background: #4a3b32; border-radius: 8px; margin: 6px auto 0;
        }

        /* --- THE SMILE LOGIC --- */
        .mouth {
            width: 14px;
            height: 6px;
            border-bottom: 3px solid #4a3b32;
            border-radius: 0 0 10px 10px;
            position: absolute;
            top: 20px;
            left: 16px;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55); /* Bouncy transition */
            transform: scaleY(0.3); /* Default: Almost flat line */
            opacity: 0.7;
        }

        /* Active State (Smile) */
        .card.active .mouth {
            transform: scaleY(1.4); /* Big Smile */
            height: 10px;
            border-bottom-width: 4px;
            opacity: 1;
        }

        /* Eyes */
        .eyes {
            display: flex; justify-content: space-between; width: 50px;
            position: absolute; top: 40px; left: 30px;
        }
        .eye {
            width: 12px; height: 12px; background: #2d2019; border-radius: 50%;
            transform: scaleY(0.1); transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            position: relative;
        }
        .card:hover .eye { transform: scaleY(1); }
        .eye::after {
            content: ''; position: absolute; top: 3px; left: 3px; width: 4px; height: 4px;
            background: #fff; border-radius: 50%; opacity: 0; transition: opacity 0.3s;
        }
        .card:hover .eye::after { opacity: 1; }

        /* Arms */
        .arm {
            width: 45px; height: 60px; border-radius: 25px; top: 90px; z-index: 3;
            transform-origin: top center; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .arm.left { left: 20px; transform: rotate(15deg); }
        .arm.right { right: 20px; transform: rotate(-15deg); }

        /* Heart */
        .heart-wrapper {
            position: absolute; top: 110px; left: 75px; z-index: 4;
            transform: scale(0) rotate(-45deg); transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .heart-shape {
            width: 50px; height: 50px; background: var(--heart-color); position: relative;
            box-shadow: 0 5px 15px rgba(255, 92, 124, 0.4);
        }
        .heart-shape::before, .heart-shape::after {
            content: ""; width: 50px; height: 50px; background: inherit; border-radius: 50%; position: absolute;
        }
        .heart-shape::before { top: -25px; left: 0; }
        .heart-shape::after { top: 0; left: 25px; }

        /* UI */
        .title {
            color: var(--text-color); font-size: 2rem; margin: 0; font-weight: 700;
            transform: translateZ(30px); opacity: 0.9;
        }
        .subtitle {
            color: #8b6b61; font-size: 1rem; margin-bottom: 25px;
            transform: translateZ(30px); font-weight: 500;
        }
        .btn {
            padding: 14px 40px; border: none; border-radius: 50px; background: var(--btn-gradient);
            color: white; font-family: inherit; font-size: 1.1rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 92, 124, 0.3); transform: translateZ(50px);
            transition: all 0.3s ease; pointer-events: auto;
        }
        .btn:hover { transform: translateZ(55px) scale(1.05); }

        /* Active Interaction */
        .card.active .arm.left { transform: rotate(-25deg) translateX(12px); }
        .card.active .arm.right { transform: rotate(25deg) translateX(-12px); }
        .card.active .heart-wrapper { transform: scale(1) rotate(-45deg); }
        
        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <canvas id="rainCanvas"></canvas>

    <div class="card" id="card" onclick="triggerLove()">
        <div class="bear-stage">
            <div class="part ear left"></div>
            <div class="part ear right"></div>
            <div class="part body"></div>
            <div class="part head">
                <div class="muzzle">
                    <div class="nose"></div>
                    <div class="mouth"></div>
                </div>
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
            </div>
            <div class="part arm left"></div>
            <div class="part arm right"></div>
            <div class="heart-wrapper">
                <div class="heart-shape"></div>
            </div>
        </div>

        <h1 class="title">To My Only One</h1>
        <p class="subtitle" id="sub">A little bear for a love</p>
        <button class="btn" id="mainBtn">My Gift 🎁</button>
    </div>

    <script>
        const card = document.getElementById('card');
        const btn = document.getElementById('mainBtn');
        const sub = document.getElementById('sub');
        const title = document.querySelector('.title');
        let isOpen = false;

        // Mouse Parallax
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 30;
            const y = (window.innerHeight / 2 - e.pageY) / 30;
            card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });

        // Trigger Function
        function triggerLove(e) {
            // Prevent double triggering
            if (isOpen) return;
            isOpen = true;

            // UI Changes
            card.classList.add('active');
            btn.innerHTML = "Happy Teddy Day! ❤️";
            sub.textContent = "Forever & Always Yours ❤️";
            title.textContent = "For You";
            title.style.animation = "gentlePulse 2s infinite ease-in-out";

            // Start Rain
            startRain();
        }

        // Button Listener (Stop propagation so we don't fire twice if card also has listener)
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            triggerLove();
        });

        // --- Canvas Rain Code ---
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        let particles = [];

        function resize() {
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = w;
            canvas.height = h;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * -h; 
            }
            reset() {
                this.x = Math.random() * w;
                this.y = -20;
                this.speed = Math.random() * 2 + 1.5;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.05 + 0.02;
                this.size = Math.random() * 15 + 10;
                this.type = Math.random() > 0.5 ? 'petal' : 'heart';
                const colors = ['#ffccd5', '#ffb3c1', '#ff8fa3', '#fff0f3'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.y += this.speed;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 1; 
                if (this.y > h + 50) this.reset();
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.wobble);
                if (this.type === 'heart') {
                    ctx.font = `${this.size}px serif`;
                    ctx.fillStyle = this.color;
                    ctx.fillText('❤', 0, 0);
                } else {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size/2, this.size, 0, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function startRain() {
            for(let i=0; i<100; i++) {
                particles.push(new Particle());
            }
            loop();
        }

        function loop() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
